name: Release

on:
  push:
    tags:
      - 'v*'

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  arch:
    name: Arch package
    runs-on: ubuntu-latest
    container: archlinux:base-devel
    steps:
      - name: Install build dependencies
        run: |
          pacman -Syu --noconfirm --needed \
            git meson ninja gcc pkgconf \
            wlroots0.20 scenefx cjson \
            libxcb xcb-util-wm wayland wayland-protocols \
            libinput libdrm libxkbcommon pcre2 pango cairo \
            pixman libdisplay-info libliftoff

      - uses: actions/checkout@v4

      - name: Package with makepkg
        run: |
          useradd -m builder
          chown -R builder:builder "$GITHUB_WORKSPACE"
          su builder -c 'cd packaging/arch/modular-mango && makepkg -f --noconfirm'

      - name: Upload package
        uses: actions/upload-artifact@v4
        with:
          name: arch-package
          path: packaging/arch/modular-mango/*.pkg.tar.zst
          if-no-files-found: error

  debian:
    name: Debian package
    runs-on: ubuntu-latest
    container: debian:sid
    env:
      DEBIAN_FRONTEND: noninteractive
    steps:
      - name: Enable source packages
        run: |
          echo "deb-src http://deb.debian.org/debian sid main" \
            >> /etc/apt/sources.list.d/debian.sources
          apt-get update
          apt-get install -y --no-install-recommends git ca-certificates

      - uses: actions/checkout@v4

      - name: Build the deb
        run: |
          apt-get install -y --no-install-recommends \
            build-essential dpkg-dev debhelper devscripts fakeroot \
            ninja-build meson pkgconf
          bash packaging/debian/generate-changelog.sh
          mkdir -p debian
          cp -a packaging/debian/. debian/
          apt-get build-dep -y .
          dpkg-buildpackage -us -uc -b -d
          mkdir -p dist
          cp ../modular-mango_*_*.deb dist/

      - name: Upload deb
        uses: actions/upload-artifact@v4
        with:
          name: debian-package
          path: dist/modular-mango_*.deb
          if-no-files-found: error

  publish:
    name: Publish release
    needs: [arch, debian]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/download-artifact@v4
        with:
          path: artifacts
          merge-multiple: true

      - name: List artifacts
        run: ls -l artifacts

      - name: Create release
        uses: softprops/action-gh-release@v2
        with:
          name: modular-mango ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            artifacts/*.pkg.tar.zst
            artifacts/*.deb
