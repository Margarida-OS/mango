name: Upstream sync

on:
  schedule:
    - cron: '0 6 * * 1'
  workflow_dispatch:

permissions:
  contents: write
  pull-requests: write
  issues: write

concurrency:
  group: upstream-sync
  cancel-in-progress: false

env:
  UPSTREAM_URL: https://github.com/mangowm/mango.git
  BRANCH: chore/upstream-sync

jobs:
  sync:
    name: Merge upstream main
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Configure git
        run: |
          git config user.name 'margarida-os-bot'
          git config user.email 'bot@margarida-os.dev'

      - name: Merge upstream
        id: merge
        run: |
          git fetch --no-tags "$UPSTREAM_URL" main
          upstream=$(git rev-parse FETCH_HEAD)

          if [ "$(git rev-list --count HEAD.."$upstream")" -eq 0 ]; then
            echo "result=none" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          git checkout -B "$BRANCH"
          if git merge --no-edit "$upstream"; then
            echo "result=merged" >> "$GITHUB_OUTPUT"
          else
            git diff --name-only --diff-filter=U > /tmp/conflicts
            git merge --abort
            echo "result=conflict" >> "$GITHUB_OUTPUT"
            echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
            exit 0
          fi

          echo "upstream=$upstream" >> "$GITHUB_OUTPUT"
          echo "count=$(git rev-list --count HEAD.."$upstream")" >> "$GITHUB_OUTPUT"

      - name: Push sync branch
        if: steps.merge.outputs.result == 'merged'
        run: git push --force-with-lease origin "$BRANCH"

      - name: Open or update pull request
        if: steps.merge.outputs.result == 'merged'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          existing=$(gh pr list --head "$BRANCH" --json number --jq '.[0].number')
          body="Automated merge of mangowm/mango main (${{ steps.merge.outputs.upstream }}).
          The Arch and Debian builds must pass before this is merged."
          if [ -n "$existing" ]; then
            gh pr edit "$existing" --title 'chore: sync upstream main' --body "$body"
            echo "Updated pull request #$existing"
          else
            gh pr create --base main --head "$BRANCH" \
              --title 'chore: sync upstream main' --body "$body"
          fi

      - name: Report conflicts
        if: steps.merge.outputs.result == 'conflict'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          if [ -n "$(gh issue list --label upstream-sync --state open --json number --jq '.[0].number')" ]; then
            echo "Conflicts already tracked by an open issue"
            exit 0
          fi
          {
            echo "Merging mangowm/mango main (${{ steps.merge.outputs.upstream }}) conflicts with our patches."
            echo
            echo 'Files in conflict:'
            sed 's/^/- /' /tmp/conflicts
          } > /tmp/issue.md
          gh label create upstream-sync --force \
            --description 'Automated issue from the upstream sync workflow' \
            --color FBCA04 >/dev/null 2>&1 || true
          gh issue create --title 'upstream-sync: manual merge required' \
            --label upstream-sync --body-file /tmp/issue.md
